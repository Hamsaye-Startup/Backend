
spring:
  config:
    activate:
      on-profile: test

eureka:
  instance:
    hostname: localhost
  dashboard:
    path: /dashboard
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      default-zone: http://${eureka.instance.hostname}:${server.port}/eureka/

server:
  port: 8761

---

spring:
  config:
    activate:
      on-profile: dev

eureka:
  instance:
    hostname: discovery-service
  dashboard:
    path: /dashboard
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      default-zone: http://${eureka.instance.hostname}:${server.port}/eureka/

server:
  port: 8761
