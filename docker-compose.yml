services:
  postgres:
    container_name: hs_pg_sql
    image: postgres
    environment:
      POSTGRES_USER: pouria
      POSTGRES_PASSWORD: hamsaye1g8S9QJsp61wD53L4nW9d5mou879cSQpD7e38BDB0LwLesB3Rog5eWzU1mp4BEY7
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5433:5432
    networks:
      - hamsaye-net
    restart: unless-stopped

  pgadmin:
    container_name: hm_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5050:80
    networks:
      - hamsaye-net
    restart: unless-stopped

networks:
  hamsaye-net:
    driver: bridge

volumes:
  postgres:
  pgadmin: